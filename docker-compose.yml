services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_hot
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar-local-only
    ports:
      - "5432:5432"
    volumes:
      - radar-postgres:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d ai_hot"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - radar-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: radar
      MINIO_ROOT_PASSWORD: radar-local-object-store
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - radar-objects:/data

volumes:
  radar-postgres:
  radar-redis:
  radar-objects:

