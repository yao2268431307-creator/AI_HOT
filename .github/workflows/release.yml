name: Release immutable production images

on:
  workflow_dispatch:
  push:
    tags:
      - "rc3-*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-hot-radar-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-hot-radar-web
  PYTHON_BASE_IMAGE: ${{ vars.PYTHON_BASE_IMAGE }}
  NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Verify backend
        run: |
          python -m pip install --disable-pip-version-check -r services/api/requirements-dev.txt
          ruff check services/api/radar services/api/tests tools
          python -m pytest -q services/api/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify web production build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Require immutable base images
        shell: bash
        run: |
          [[ "$PYTHON_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "PYTHON_BASE_IMAGE must be repository@sha256"; exit 1; }
          [[ "$NODE_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "NODE_BASE_IMAGE must be repository@sha256"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build and push API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          build-args: PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE_IMAGE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Attest API provenance
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Sign API image
        run: cosign sign --yes "${API_IMAGE}@${{ steps.api.outputs.digest }}"

      - name: Build and push Web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          build-args: NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Attest Web provenance
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Sign Web image
        run: cosign sign --yes "${WEB_IMAGE}@${{ steps.web.outputs.digest }}"

      - name: Verify signatures and build release manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads|tags)/.+"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "${API_IMAGE}@${API_DIGEST}"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "${WEB_IMAGE}@${WEB_DIGEST}"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg apiRepository "$API_IMAGE" --arg apiDigest "$API_DIGEST" \
            --arg webRepository "$WEB_IMAGE" --arg webDigest "$WEB_DIGEST" \
            --arg pythonBase "$PYTHON_BASE_IMAGE" --arg nodeBase "$NODE_BASE_IMAGE" \
            '{schemaVersion:"ai-hot-release-manifest-v1",commit:$commit,repository:$repository,api:{repository:$apiRepository,digest:$apiDigest},web:{repository:$webRepository,digest:$webDigest},baseImages:{python:$pythonBase,node:$nodeBase}}' \
            > release-manifest.json
          sha256sum release-manifest.json > release-manifest.json.sha256
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json
          cosign verify-blob release-manifest.json \
            --bundle release-manifest.sigstore.json \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-${{ github.sha }}
          path: |
            release-manifest.json
            release-manifest.json.sha256
            release-manifest.sigstore.json
          if-no-files-found: error
          retention-days: 90
